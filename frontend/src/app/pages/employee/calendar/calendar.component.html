<div class="calendar-container animate-fade-up">
  <div class="calendar-content">

    <div class="calendar-main-card">
      <full-calendar #calendar [options]="calendarOptions"></full-calendar>
    </div>

    <aside class="calendar-sidebar">
      
      <!-- View Switcher -->
      <div class="view-switcher">
        <button (click)="changeView('dayGridMonth')" [class.active]="currentView === 'dayGridMonth'">Month</button>
        <button (click)="changeView('timeGridWeek')" [class.active]="currentView === 'timeGridWeek'">Week</button>
        <button (click)="changeView('timeGridDay')" [class.active]="currentView === 'timeGridDay'">Day</button>
      </div>

      <p-card styleClass="sidebar-card">
        <h3 class="sidebar-title">Upcoming deadlines</h3>
        <div class="deadline-list">
          <div class="deadline-card" *ngFor="let item of currentMonthDeadlines">
            <div class="deadline-header">
              <span class="deadline-title">{{item.title}}</span>
              <span class="badge" [ngClass]="'badge-' + item.type.toLowerCase()">{{item.type}}</span>
            </div>
            <div class="deadline-meta">{{formatDate(item.date)}} &bull; {{item.time}}</div>
          </div>
          <div *ngIf="currentMonthDeadlines.length === 0" class="empty-state">No deadlines this month.</div>
        </div>
      </p-card>

      <p-card styleClass="sidebar-card">
        <h3 class="sidebar-title">Quick reminders</h3>
        <div class="reminder-list">
          <div class="reminder-item" *ngFor="let r of reminders" (click)="toggleReminder(r)">
            <div class="check-circle" [class.done]="r.done">
              <svg *ngIf="r.done" width="9" height="7" viewBox="0 0 9 7" fill="none">
                <path d="M1 3.5L3.5 6L8 1" stroke="#FE0707" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="reminder-text" [class.done]="r.done">{{r.text}}</span>
          </div>
        </div>
        <div class="progress-footer">
          <div class="progress-header">
            <span class="progress-label">Weekly progress</span>
            <span class="progress-val">{{weeklyProgress}}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" [style.width.%]="weeklyProgress"></div>
          </div>
        </div>
      </p-card>

    </aside>
  </div>
</div>
